name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        shell: pwsh
        run: dotnet test GuvenOn.slnx -c Release -warnaserror

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Runtime win-x64 -SelfContained -Installer

      # Code signing is intentionally not wired up yet. When the certificate is
      # available, sign the installer and the executables here, before the
      # release is published. Never publish an unsigned production build.
      #
      # - name: Sign artifacts
      #   shell: pwsh
      #   env:
      #     SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
      #     SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
      #     SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
      #   run: ./scripts/sign.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guvenon-windows-x64
          path: |
            artifacts/installer/*.exe
            artifacts/latest.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            "artifacts/installer/GuvenOnSetup-$version.exe" `
            "artifacts/latest.json" `
            --title "Guven-ON $version" `
            --generate-notes

  linux:
    runs-on: ubuntu-latest
    needs: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Debian package
        shell: bash
        run: bash linux/build-deb.sh

      - name: Validate nftables ruleset
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          ./build/linux/linux-x64/guvenon-linuxd --print-ruleset > /tmp/guvenon.nft
          sudo nft -c -f /tmp/guvenon.nft

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: guvenon-linux-x64
          path: |
            artifacts/linux/*.deb
            artifacts/linux/*.sha256
          if-no-files-found: error

      - name: Attach Debian package to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            artifacts/linux/*.deb \
            artifacts/linux/*.sha256 \
            --clobber
