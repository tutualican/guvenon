ShortDescription: Ruhiger Schutz für unsichere WLAN-Netze unter Windows 11.
Description: >-
  Guven-ON ist ein Sicherheitswerkzeug für Windows 11, das DNS-Leaks und die
  Offenlegung des lokalen Netzwerks in unsicheren WLANs verhindern soll. Es
  installiert einen lokalen Dienst und eine ruhige Tray-App, folgt der
  Windows-Anzeigesprache und spricht Englisch, Deutsch und Türkisch. Dies ist
  eine frühe Vorschau: Dienst, Installer, Updateprüfung und Oberfläche sind
  real, die Paketfilterung und DNS-Durchsetzung sind jedoch noch nicht aktiv.
