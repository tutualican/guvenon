InstallationNotes: >-
  Vorschauversion. Die Netzwerkfilterung ist noch nicht aktiv und der Installer
  ist nicht signiert. Prüfen Sie vor dem Ausführen die mit dem Release
  veröffentlichte SHA-256-Prüfsumme.
