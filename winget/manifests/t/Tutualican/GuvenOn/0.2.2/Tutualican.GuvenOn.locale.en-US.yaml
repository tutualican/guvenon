ShortDescription: Opt-in DNS and LAN protection for untrusted Wi-Fi on Windows 11.
Description: >-
  Guven-ON is a Windows 11 security tool that blocks DNS leaks and local-network
  exposure on untrusted Wi-Fi. It installs a LocalSystem service and a calm tray
  app, follows the Windows display language, and offers English, German and
  Turkish. Protection is off until you enable it. This preview applies persistent
  WFP filters and trusted DNS on active adapters; it is unsigned and still
  missing automatic trust profiles, DoH blocking and full IPv6 isolation. An
  exact-IP allowlist keeps chosen printers, NAS devices and consoles reachable.
  Persistent filters survive a service crash and are verified by a self-test.
