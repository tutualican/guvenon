ReleaseNotesUrl: https://github.com/tutualican/guvenon/releases/tag/v0.2.2
InstallationNotes: >-
  Preview build. Protection is opt-in and the installer is unsigned. Verify the
  SHA-256 published with the release before running it. Windows 11 22H2 or later,
  x64. Protection intent is restored after a service restart or reboot.
