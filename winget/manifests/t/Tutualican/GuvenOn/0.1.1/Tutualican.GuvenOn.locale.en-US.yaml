ShortDescription: Quiet protection for untrusted Wi-Fi on Windows 11.
Description: >-
  Guven-ON is a Windows 11 security tool designed to block DNS leaks and
  local-network exposure on untrusted Wi-Fi. It installs a local service and a
  calm tray app, follows the Windows display language, and offers English,
  German and Turkish. This is an early preview: the service, installer, update
  check and user interface are real, but packet filtering and DNS enforcement
  are not enabled yet.
