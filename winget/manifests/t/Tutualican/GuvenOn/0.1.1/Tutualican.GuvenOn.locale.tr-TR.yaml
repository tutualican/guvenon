ShortDescription: Windows 11'de güvenilmeyen Wi-Fi ağları için sessiz koruma.
Description: >-
  Guven-ON, güvenilmeyen Wi-Fi ağlarında DNS sızıntılarını ve yerel ağ
  görünürlüğünü engellemek için tasarlanmış bir Windows 11 güvenlik aracıdır.
  Yerel bir servis ve sakin bir tepsi uygulaması kurar, Windows görüntüleme
  dilini izler ve İngilizce, Almanca ve Türkçe konuşur. Bu erken bir önizleme
  sürümüdür: servis, yükleyici, güncelleme kontrolü ve arayüz gerçektir; ancak
  paket filtreleme ve DNS zorlaması henüz etkin değildir.
