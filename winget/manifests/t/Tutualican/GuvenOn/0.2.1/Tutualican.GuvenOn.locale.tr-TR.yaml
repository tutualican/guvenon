ShortDescription: Windows 11'de güvenilmeyen Wi-Fi ağları için isteğe bağlı DNS ve LAN koruması.
Description: >-
  Guven-ON, güvenilmeyen Wi-Fi ağlarında DNS sızıntılarını ve yerel ağ
  maruziyetini engelleyen bir Windows 11 güvenlik aracıdır. LocalSystem servisi
  ve sakin bir tepsi uygulaması kurar, Windows görüntüleme dilini izler ve
  İngilizce, Almanca ve Türkçe konuşur. Koruma siz açana kadar kapalıdır. Bu
  önizleme etkin bağdaştırıcılarda kalıcı WFP filtreleri ve güvenilir DNS
  uygular; imzasızdır ve otomatik güven profilleri, LAN izin listesi, DoH
  engelleme ve tam IPv6 yalıtımı henüz yoktur. Kalıcı filtreler servis
  çökmesinden sonra korunur ve bir öz test ile doğrulanır.
