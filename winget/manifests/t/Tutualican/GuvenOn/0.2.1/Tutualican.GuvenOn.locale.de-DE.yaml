InstallationNotes: >-
  Vorschauversion. Der Schutz ist opt-in und der Installer ist nicht signiert.
  Prüfen Sie vor dem Ausführen die mit dem Release veröffentlichte
  SHA-256-Prüfsumme. Windows 11 22H2 oder neuer, x64. Die Schutzabsicht wird nach
  einem Neustart des Dienstes oder des Systems wiederhergestellt.
