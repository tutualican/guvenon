InstallationNotes: >-
  Önizleme sürümü. Koruma isteğe bağlıdır ve yükleyici imzasızdır. Çalıştırmadan
  önce sürümle yayımlanan SHA-256 değerini doğrulayın. Windows 11 22H2 veya
  üzeri, x64. Yeniden başlatmadan sonra korumayı tekrar açın; bu sürümde
  oturumla sınırlıdır.
