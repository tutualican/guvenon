ShortDescription: Opt-in DNS- und LAN-Schutz für unsichere WLAN-Netze unter Windows 11.
Description: >-
  Guven-ON ist ein Sicherheitswerkzeug für Windows 11, das DNS-Leaks und die
  Offenlegung des lokalen Netzwerks in unsicheren WLANs blockiert. Es installiert
  einen LocalSystem-Dienst und eine ruhige Tray-App, folgt der
  Windows-Anzeigesprache und spricht Englisch, Deutsch und Türkisch. Der Schutz
  ist aus, bis Sie ihn aktivieren. Diese Vorschau wendet dynamische WFP-Filter
  und vertrauenswürdiges DNS auf aktiven Adaptern an; sie ist nicht signiert und
  automatische Vertrauensprofile, LAN-Allowlist, DoH-Blockierung und Fail-Closed
  nach einem Dienstabsturz fehlen noch.
