ReleaseNotesUrl: https://github.com/tutualican/guvenon/releases/tag/v0.2.0
InstallationNotes: >-
  Vorschauversion. Der Schutz ist opt-in und der Installer ist nicht signiert.
  Prüfen Sie vor dem Ausführen die mit dem Release veröffentlichte
  SHA-256-Prüfsumme. Windows 11 22H2 oder neuer, x64. Aktivieren Sie den Schutz
  nach einem Neustart erneut; er gilt in diesem Build nur für die Sitzung.
