ReleaseNotesUrl: https://github.com/tutualican/guvenon/releases/tag/v0.2.0
InstallationNotes: >-
  Preview build. Protection is opt-in and the installer is unsigned. Verify the
  SHA-256 published with the release before running it. Windows 11 22H2 or later,
  x64. Re-enable protection after a reboot; it is session-scoped in this build.
