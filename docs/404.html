<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ea">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Page not found — Guven-ON</title>
  <link rel="icon" type="image/png" href="https://tutualican.github.io/guvenon/assets/guvenon.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ea;
      --ink: #11142a;
      --muted: #5d5a52;
      --blue: #1b2a8c;
      --line: #e4ddd0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background-color: var(--bg);
      background-image: radial-gradient(rgba(14, 23, 90, 0.035) 0.65px, transparent 0.75px);
      background-size: 9px 9px;
      color: var(--ink);
      font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    main {
      width: min(620px, 100%);
      padding: clamp(30px, 7vw, 56px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: #fffdf8;
      box-shadow: 0 24px 60px rgba(26, 25, 20, 0.1);
    }

    img { width: 56px; height: 56px; }

    p {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    h1 {
      margin: 22px 0 0;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    a {
      display: inline-block;
      margin-top: 26px;
      padding: 11px 18px;
      border-radius: 999px;
      background: var(--blue);
      color: #fffdf8;
      font-weight: 600;
      text-decoration: none;
    }

    a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

    .de, .tr { display: none; }
    .de p, .tr p { margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <img src="https://tutualican.github.io/guvenon/assets/guvenon.png" alt="">
    <h1>Page not found.</h1>
    <p>This page does not exist. The Guven-ON site is still right here.</p>
    <div class="de" lang="de">
      <p>Diese Seite existiert nicht. Die Guven-ON-Website finden Sie hier.</p>
    </div>
    <div class="tr" lang="tr">
      <p>Bu sayfa mevcut değil. Guven-ON sitesi burada.</p>
    </div>
    <a href="https://tutualican.github.io/guvenon/">Guven-ON →</a>
  </main>
  <script>
    (() => {
      const code = String(navigator.language || "en").slice(0, 2).toLowerCase();
      const titles = {
        en: "Page not found.",
        de: "Seite nicht gefunden.",
        tr: "Sayfa bulunamadı."
      };
      const links = {
        en: "Guven-ON →",
        de: "Zu Guven-ON →",
        tr: "Guven-ON'a git →"
      };
      const language = titles[code] ? code : "en";
      document.documentElement.lang = language;
      document.querySelector("h1").textContent = titles[language];
      document.querySelector("main > a").textContent = links[language];
      if (language !== "en") {
        document.querySelector("." + language).style.display = "block";
        document.querySelector("main > p").style.display = "none";
      }
    })();
  </script>
</body>
</html>
